[project]
name = "capstone-app"
version = "0.1.0"
description = "Customer 360 — Databricks Apps + Lakebase capstone"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "databricks-sdk>=0.81",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.4",
    "cachetools>=5.5",
]

# Pin the index to public PyPI so uv.lock is portable. Without this, uv writes
# whatever default index the developer's global uv config uses into the lock —
# if that's an internal mirror, the Apps build sandbox can't reach it and
# `uv sync` fails with connection timeouts.
[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true

# Dev tools in an optional extra (local: `uv sync --extra dev`).
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
line-length = 100
target-version = "py311"
