[project]
name = "capstone-app"
version = "0.1.0"
description = "Customer 360 — Databricks Apps + Lakebase capstone"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "databricks-sdk>=0.81",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.4",
    "cachetools>=5.5",
    # Pin anyio: the 4.14.2 wheel intermittently times out on the Apps build's
    # pypi-proxy; 4.6.2 is a well-cached, compatible version.
    "anyio==4.6.2.post1",
]

# Dev tools live in an optional extra so the Apps build (`uv sync`) does NOT
# download them — fewer wheels = fewer chances to hit a flaky pypi-proxy timeout.
# Install locally with: uv sync --extra dev
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
line-length = 100
target-version = "py311"
