# Forward-ETL job (T7 Pattern A — psycopg + MERGE INTO Delta).
#
# Runs the merge-into-gold notebook on serverless compute: reads processed=false
# rows from Lakebase staging via psycopg, MERGEs them into Delta gold, and marks
# them processed. Triggered on demand from the Reports page via
# POST /api/jobs/run-forward-etl (SP client). The bundle exposes this job's id to
# the app through resources/app.yml (`forward_etl_job`), which app.yaml maps to
# FORWARD_ETL_JOB_ID.
#
# Pattern A (not B/Lakehouse-Sync) because Lakebase CDF requires an Autoscaling
# Postgres 17 instance; capstone-pg is provisioned Postgres 16.

resources:
  jobs:
    forward_etl_job:
      name: customer360-forward-etl
      description: "Promote Lakebase staging → Delta gold (psycopg + idempotent MERGE)"
      tasks:
        - task_key: merge_into_gold
          notebook_task:
            notebook_path: ../lakebase/forward_etl/pattern_a_psycopg/merge_into_gold.py
            base_parameters:
              gold_catalog: ${var.catalog}
              instance_name: ${var.lakebase_instance}
              database_name: capstone_db
      queue:
        enabled: true
